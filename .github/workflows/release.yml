name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    # 이 패키지는 package.json 에 os: ["darwin"] 을 선언한다(launchd/Keychain 의존).
    # linux 러너에서는 npm ci 가 루트 패키지의 os 필드를 검사해 EBADPLATFORM 으로
    # 즉시 실패한다 — 2026-08-24 run 32701968072. 러너를 패키지 플랫폼에 맞춘다.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Create Release Pull Request or Tag
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npx changeset tag
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
