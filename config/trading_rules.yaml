# config/trading_rules.yaml — 운영 파라미터
# [모의=실전 정렬 2026-08-21] paper는 실전 리허설이다 — 실전에서 쓸 수 없는
# 완화(킬스위치 해제, 레짐 게이트 OFF, 단일표 진입)는 paper에도 두지 않는다.
# 보수 원본은 trading_rules.yaml.bak-conservative 에 보존.
# 변경 시 git commit + 1주일 cooldown 후 실거래 반영 (Risk R11).

# ============================================================
# 가드레일 — LLM 출력 clamp 임계값
# ============================================================
guardrails:
  # 비중 — [사이징 확대 2026-07-06] 종목당 30~45만원이 너무 소액이라 표준 상향
  # (영기 확정: 종목당 150~300만원 목표, 시드 3,000만 기준)
  max_size_pct: 15.0       # [적극 투입] 10.0 → 15.0
  min_size_pct: 5.0        # [적극 투입] 3.0 → 5.0

  # 손절 — ATR 기반 동적, clamp 범위
  min_stop_loss_pct: 1.5
  max_stop_loss_pct: 3.0

  # 익절 — ATR×1.5 기본, clamp 범위
  min_take_profit_pct: 2.0
  max_take_profit_pct: 10.0

  # 보유 / 동시성
  max_hold_days: 5
  max_position_count: 18   # [적극 투입] 12 → 18
  max_daily_entries: 12    # [적극 투입] 8 → 12

  # 신뢰도 임계 — [공격적] 8 → 5 (config + prompt 동시 완화해야 실효)
  min_confidence: 5
  entry_min_confidence: 5
  close_now_min_confidence: 5

  # Anti-loop
  max_tp_raises: 3

  # 계좌 리스크 — 초기 손절까지 허용 손실률
  # [사이징 확대 2026-07-06] 0.25 → 0.5: SL 2.5% 기준 포지션 상한 ~20%라
  # size_pct(10%)가 지배하도록. 0.25로 두면 SL 3% 후보가 8.3%에서 잘림.
  risk_per_trade_pct: 0.5

# ============================================================
# 부분 익절 — TP 1차 도달 시 일부 매도로 실익 확보 (2026-07-06 신설)
# 잔여분: TP를 measured-move로 연장(tp + (tp-entry)×extension),
# 손절가는 본전(진입가)으로 상향 → 잔여분 최악 케이스도 거래 전체는 순이익.
# 포지션당 1회 — 연장 TP 재도달 시 잔여 전량 청산. 1주 포지션은 전량 익절.
# ============================================================
take_profit_partial:
  enabled: true
  sell_pct: 50        # 1차 도달 시 매도 비율 (%)
  extension: 0.5      # 잔여 TP 연장 배수
  breakeven_stop: true

# ============================================================
# Kill Switch — [모의=실전 2026-08-21] 실전 보호 기준 복원. 8%/15%/12회는
# 가동 90% 전 종목 -3% 손절이어도 -2.7%라 도달 불가한 장식값이었다.
# ============================================================
kill_switch:
  daily_loss_pct: 2.0         # 계좌 -2% 도달 시 전체 청산 + 매수 잠금
  weekly_loss_pct: 5.0        # 누적 -5% 시 매수 잠금
  consecutive_stop_loss: 5    # 연속 손절 5회 시 매수 잠금
  llm_parse_fail_rate: 0.50
  mcp_silence_min: 30

# ============================================================
# 진입 — 타이밍 + 우선순위
# ============================================================
entry:
  default_strategy: MARKET_OPEN
  after_hours_allowed: true
  signal_score_min: 3             # [공격적] 5 → 3 (후보 확대)

# ============================================================
# Strategy Budgets — [공격적] 전략당 일일 진입 1 → 2
# ============================================================
strategy_budgets:
  flow_momentum:
    enabled: true
    max_daily_entries: 3
    max_hold_days: 5
  price_momentum:
    enabled: true
    max_daily_entries: 3
    max_hold_days: 5
  short_cover:
    enabled: true
    max_daily_entries: 3
    max_hold_days: 3
  turtle_breakout:
    enabled: true
    max_daily_entries: 3
    max_hold_days: 15
  us_breakout_55:
    enabled: true
    max_daily_entries: 3
    max_hold_days: 20
  us_breakout_20:
    enabled: true
    max_daily_entries: 3
    max_hold_days: 10
  us_relative_momentum:
    enabled: true
    max_daily_entries: 3
    max_hold_days: 10
  value_quality:
    enabled: true
    mode: filter_only

# ============================================================
# 모니터 — 동적 조정 주기
# ============================================================
monitor:
  interval_min: 30
  regular_session_start: "09:00"
  regular_session_end: "15:30"
  trailing_atr_multiplier: 1.5
  enforce_at_close: true

# ============================================================
# LLM — CLI 모드
# ============================================================
llm:
  mode: cli
  claude_bin: /opt/homebrew/bin/claude
  pi_bin: /opt/homebrew/bin/pi

  entry_self_consistency: 3        # [모의=실전 2026-08-21] 3표 다수결 복원 — 단일표
                                   # 데이터는 실전(다수결)의 성과를 대변하지 못한다
  monitor_self_consistency: 1

  timeout_sec_entry: 180
  timeout_sec_monitor: 90

  json_parse_retries: 3

# ============================================================
# Watchlist — 진입 후보 종목
# ============================================================
watchlist:
  source: ~/stock-signal-bot/config/watchlist.txt
  exclude:
    - "028300"  # HLB (임상 종목 — 거래정지 위험)
  min_market_cap_eok: 5000

# ============================================================
# Universe Filter — 절대 차단 조건 (안전상 유지)
# ============================================================
universe_filter:
  reject_managed: true
  reject_warning: true
  reject_suspended: true
  reject_etn: true
  reject_elw: true

# ============================================================
# Market Regime — [모의=실전 2026-08-21] 게이트 복원 (약세장 추격 매수 차단)
# ============================================================
market_regime:
  block_if_kospi_5d_pct_below: -2.0     # KOSPI 5일 누적 -2% 미만 → 차단
  block_if_kosdaq_5d_pct_below: -3.0    # KOSDAQ 5일 누적 -3% 미만 → 차단
  block_if_vix_above: 25.0              # VIX > 25 → 위험 회피 레짐
  block_if_kospi_1d_pct_below: -2.0     # KOSPI 당일 -2% 미만 → 익일 panic day 차단

# ============================================================
# 데이터 소스
# ============================================================
data:
  signal_dir: ~/stock-signal-bot/data/signals
  trades_db: ~/stock-trader/data/trades.sqlite
  signal_max_age_min: 60

# ============================================================
# 알림
# ============================================================
notify:
  telegram_bot_account: stock-trader
  log_levels:
    critical: true
    warning: true
    info: true
    daily: true
    debug: false

# ============================================================
# 자본 — Phase 별
# ============================================================
capital:
  phase: 3
  paper_capital_won: 30_000_000
  real_capital_won: 0
  # [적극 투입 2026-08-12] 총자산 대비 목표 투자 비중. cash_buffer_pct 는
  # 주문 거부·수수료·부분체결 여유로 남기는 현금 비중.
  target_utilization_pct: 90.0
  cash_buffer_pct: 10.0

# ============================================================
# 해외주식 — KIS paper 해외주식 주문 경로
# ============================================================
overseas:
  enabled: true
  paper_capital_usd: 10_000
  max_size_pct: 3.0          # [공격적] 5.0 → 3.0 (국내와 일관, 분산)
  risk_per_trade_pct: 0.25

# ============================================================
# Paper Probe — [공격적] 일반 문턱(5)이 낮아 probe 역할 축소되나 유지
# ============================================================
paper_probe:
  enabled: true
  min_confidence: 5.0        # [공격적] 7.5 → 5.0 (일반 문턱과 정렬)
  max_size_pct: 1.0
  strategies:
    - turtle_breakout
  asset_classes:
    - overseas_stock

# 장중 현금 재배치 — 청산으로 회수된 현금을 같은 날 다시 투입한다.
# 아침 진입(guardrails.max_daily_entries)과 예산 카운터가 분리되어 있다.
cash_deploy:
  enabled: true
  max_daily_entries: 6         # 재배치 전용 일일 진입 상한
  max_candidates_per_run: 4    # 틱당 LLM 평가 상한 (4×180s=12분 < 락 15분 < 간격 30분)
  min_deploy_won: 500_000      # 미달분이 이보다 작으면 발주하지 않음 (잔돈 주문 방지)
  underrun_warn_pct: 70.0      # 가동률이 이 아래면 하루 1회 경고

# ============================================================
# 지수 ETF 단계적 줄줗 (dip-buy) — 2026-06-29
# 코스피/코스닥이 많이 빠지면 차단이 아니라 단계별로 지수 ETF를 매수(역발상).
# 수급 신호와 무관한 독립 경로. 해외(overseas_stock) 잡에선 미동작.
# ============================================================
dip_buy:
  enabled: true
  window_days: 5
  index_etf:
    kospi: "069500"     # KODEX 200
    kosdaq: "229200"    # KODEX 코스닥150
  tranches:
    # [사이징 확대 2026-07-06] 2/3/5 → 5/7.5/10 (트랜치당 150~300만원)
    - drop_pct: -3.0
      size_pct: 5.0
    - drop_pct: -6.0
      size_pct: 7.5
    - drop_pct: -10.0
      size_pct: 10.0
  max_total_exposure_pct: 25.0   # [사이징 확대] 15 → 25 (트랜치 합산 상향분 반영)
  stop_loss_pct: 8.0
  take_profit_pct: 5.0
  max_hold_days: 20
