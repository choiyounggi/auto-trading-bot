[project]
name = "stock-trader"
version = "0.0.1"
description = "LLM 기반 한국 주식 완전자동매매 (stock-signal-bot 신호 연계 + 키움 MCP)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "mcp>=0.9",
    "jsonschema>=4.21",
    "holidays>=0.50",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
