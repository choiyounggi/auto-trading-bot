[project]
name = "kis-trader"
version = "0.0.1"
description = "LLM 기반 한국투자증권(KIS) 자동매매 엔진"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "jsonschema>=4.21",
    "holidays>=0.50",
    "pykrx>=1.0.45",
    "pandas>=2.0",
    "numpy>=1.24",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
